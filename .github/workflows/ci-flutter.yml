name: Flutter CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/campus_hub_app/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/campus_hub_app/**'
      - '.github/workflows/ci-flutter.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/campus_hub_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            if merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"; then
              diff_range="$merge_base...HEAD"
            else
              diff_range="origin/${{ github.base_ref }}..HEAD"
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            diff_range="HEAD~1...HEAD"
          else
            diff_range="${{ github.event.before }}...${{ github.sha }}"
          fi

          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMRT "$diff_range" \
              | grep '^apps/campus_hub_app/.*\.dart$' \
              | sed 's#^apps/campus_hub_app/##' || true
          )

          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
