services:
  # Database Service
  postgres:
    image: postgres:17-alpine
    container_name: campushub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-campushub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campushub-network

  # In-Memory Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: campushub-redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campushub-network

  # Node.js Express REST API & Socket.IO Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub-backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_prod_password}@postgres:5432/${POSTGRES_DB:-campushub}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-campushub-production-access-token-secret-jwt-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-campushub-production-refresh-token-secret-jwt-key-2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campushub-network

  # Flutter Web Application
  frontend:
    build:
      context: ./apps/campus_hub_app
      dockerfile: Dockerfile
    container_name: campushub-frontend
    restart: always
    networks:
      - campushub-network

  # Nginx Gateway & SSL Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: campushub-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - campushub-network

  # Prometheus Metric Collector
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: campushub-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - campushub-network

  # Grafana Dashboard Analytics
  grafana:
    image: grafana/grafana:11.1.0
    container_name: campushub-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-campushub_grafana_pass}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - campushub-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  campushub-network:
    driver: bridge
