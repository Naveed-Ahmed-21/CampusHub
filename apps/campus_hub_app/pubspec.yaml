name: campus_hub_app
description: "CampusHub Digital Campus Ecosystem Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing & Navigation
  go_router: ^14.6.2

  # Networking & Realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Secure Local Storage
  flutter_secure_storage: ^9.2.2

  # Utilities & Code Generation Annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
